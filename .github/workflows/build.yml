name: AEXT Multiplatform Release (Desktop & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Desktop App
        run: npm run tauri build

      - name: Prepare Windows Artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p release_dist
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.0-windows-x64-setup.exe"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.0-windows-x64.msi"
          }
          Get-ChildItem -Path src-tauri/target/release/aext.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.0-windows-x64.exe"
          }

      - name: Prepare Linux Artifacts
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p release_dist
          find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} release_dist/AEXT-v1.0.0-linux-x86_64.AppImage \; || true
          find src-tauri/target/release/bundle -name "*.deb" -exec cp {} release_dist/AEXT-v1.0.0-linux-amd64.deb \; || true
          find src-tauri/target/release -maxdepth 1 -type f -name "aext" -exec cp {} release_dist/AEXT-v1.0.0-linux-x86_64.bin \; || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Desktop-${{ matrix.platform }}
          path: release_dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK & SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Init and Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          npx tauri android init
          npx tauri android build --apk

      - name: Prepare Android APK Artifacts
        run: |
          mkdir -p release_dist
          find src-tauri/gen/android -name "*.apk" | while read -r file; do
            echo "Encontrado APK: $file"
            case "$file" in
              *universal*) cp "$file" release_dist/AEXT-v1.0.0-android-universal.apk ;;
              *arm64*) cp "$file" release_dist/AEXT-v1.0.0-android-arm64-v8a.apk ;;
              *) cp "$file" "release_dist/$(basename "$file")" ;;
            esac
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Android-APK
          path: release_dist/*
