name: AEXT Multiplatform Release (Desktop & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Desktop App
        run: npm run tauri build

      - name: Rename and Prepare Windows Artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p release_dist
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.0-windows-x64-setup.exe"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.0-windows-x64.msi"
          }

      - name: Rename and Prepare Linux Artifacts
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p release_dist
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} release_dist/AEXT-v1.0.0-linux-x86_64.AppImage \; || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} release_dist/AEXT-v1.0.0-linux-amd64.deb \; || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Desktop-${{ matrix.platform }}
          path: release_dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Init and Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init || true
          npx tauri android build --apk || true

      - name: Rename and Prepare Android APK
        run: |
          mkdir -p release_dist
          find src-tauri/gen/android -name "*universal*.apk" -exec cp {} release_dist/AEXT-v1.0.0-android-universal.apk \; || true
          find src-tauri/gen/android -name "*arm64*.apk" -exec cp {} release_dist/AEXT-v1.0.0-android-arm64-v8a.apk \; || true
          # Fallback si no hay subcarpetas específicas
          find src-tauri/gen/android -name "*.apk" -exec cp {} release_dist/AEXT-v1.0.0-android-app.apk \; || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Android-APK
          path: release_dist/*
