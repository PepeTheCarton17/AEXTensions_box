name: AEXT Multiplatform Release (Desktop & Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set application version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Building AEXT v$VERSION"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n')"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));p.version='$VERSION';if(p.packages&&p.packages['']){p.packages[''].version='$VERSION'}fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Desktop App
        run: npm run tauri build

      - name: Prepare Windows Artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p release_dist
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.${{ github.run_number }}-windows-x64-setup.exe"
          }
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.${{ github.run_number }}-windows-x64.msi"
          }
          Get-ChildItem -Path src-tauri/target/release/aext.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_dist/AEXT-v1.0.${{ github.run_number }}-windows-x64.exe"
          }

      - name: Prepare Linux Artifacts
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p release_dist
          find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} release_dist/AEXT-v1.0.${{ github.run_number }}-linux-x86_64.AppImage \; || true
          find src-tauri/target/release/bundle -name "*.deb" -exec cp {} release_dist/AEXT-v1.0.${{ github.run_number }}-linux-amd64.deb \; || true
          find src-tauri/target/release -maxdepth 1 -type f -name "aext" -exec cp {} release_dist/AEXT-v1.0.${{ github.run_number }}-linux-x86_64.bin \; || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Desktop-${{ matrix.platform }}
          path: release_dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set application version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Building AEXT v$VERSION"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n')"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));p.version='$VERSION';if(p.packages&&p.packages['']){p.packages[''].version='$VERSION'}fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK & SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Init and Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          npx tauri android init
          npx tauri android build --apk

      - name: Prepare Android APK Artifacts
        run: |
          mkdir -p release_dist
          find src-tauri/gen/android -name "*.apk" | while read -r file; do
            echo "Encontrado APK: $file"
            case "$file" in
              *universal*) cp "$file" "release_dist/AEXT-v1.0.${{ github.run_number }}-android-universal.apk" ;;
              *arm64*) cp "$file" "release_dist/AEXT-v1.0.${{ github.run_number }}-android-arm64-v8a.apk" ;;
              *) cp "$file" "release_dist/$(basename "$file")" ;;
            esac
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEXT-Android-APK
          path: release_dist/*

  generated-extension-check:
    name: Generated Extension Compiles
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.5.1

      - name: Ensure Android SDK 34
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Primero las pruebas del analizador/generador: comprueban que los filtros
      # detectados, el SearchAction y el catálogo JSON-LD llegan al Kotlin.
      - name: Rust tests (analyzer and generator)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Genera cinco proyectos con las plantillas reales (anime verificado,
      # anime genérico, catálogo JSON-LD, SPA multilingüe y manga). Si una plantilla no compila,
      # este job falla antes de publicar una versión de AEXT que produciría
      # extensiones rotas.
      - name: Generate sample extensions
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin sample_ext -- "$RUNNER_TEMP/samples"

      - name: Compile sample extensions
        run: |
          for project in "$RUNNER_TEMP"/samples/*/; do
            echo "== Compilando $project"
            gradle -p "$project" assembleRelease --no-daemon --console=plain
          done

      - name: Check the generated APKs exist and are signed
        run: |
          find "$RUNNER_TEMP/samples" -name "*.apk" -print
          count=$(find "$RUNNER_TEMP/samples" -name "*.apk" | wc -l)
          test "$count" -eq 5
          for apk in $(find "$RUNNER_TEMP/samples" -name "*.apk"); do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -n 3
          done

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-desktop, build-android, generated-extension-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Consolidate binaries for Release
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) | while read -r f; do
            echo "Añadiendo a Release: $f"
            cp "$f" release_assets/
          done
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AEXT v1.0.${{ github.run_number }} - Multiplatform Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
          body: |
            ## AEXT v1.0.${{ github.run_number }} - Creador Automatizado de Extensiones Nekoyomi

            Aplicación oficial multiplataforma (Android, Windows, Linux) para automatizar la creación de extensiones compatibles con Nekoyomi y Aniyomi, con servidor API local y servidor MCP embebido para herramientas de diagnóstico externas.

            ### Archivos de Instalación Disponibles:

            | Plataforma | Archivo | Arquitectura |
            | :--- | :--- | :--- |
            | **Android (Móvil)** | `AEXT-v1.0.${{ github.run_number }}-android-universal.apk` | Universal (arm64, armv7, x86_64) |
            | **Android (Móvil arm64)** | `AEXT-v1.0.${{ github.run_number }}-android-arm64-v8a.apk` | arm64-v8a |
            | **Windows (PC Instalador)** | `AEXT-v1.0.${{ github.run_number }}-windows-x64-setup.exe` | x86_64 |
            | **Windows (PC MSI)** | `AEXT-v1.0.${{ github.run_number }}-windows-x64.msi` | x86_64 |
            | **Linux (PC AppImage)** | `AEXT-v1.0.${{ github.run_number }}-linux-x86_64.AppImage` | x86_64 |
            | **Linux (PC Debian/Ubuntu)**| `AEXT-v1.0.${{ github.run_number }}-linux-amd64.deb` | x86_64 |

            ### Novedades de esta versión

            - Versión de la aplicación sincronizada con la release (la app ya no muestra una versión antigua).
            - El CI genera y **compila** extensiones de ejemplo (anime y manga) con Gradle antes de publicar: si una plantilla deja de compilar, la release no se publica.
            - Firma propia de AEXT (`signingkey.jks`, alias `aext`) incluida en cada proyecto generado, para que las actualizaciones no den error de firma.
            - Selector de repositorio con opción «Ninguno» y campo para escribir otro repositorio.
            - Panel de generación desplazable en pantallas pequeñas.
            - Compilación local opcional con Gradle + Android SDK (detecta Java, Kotlin, Gradle y SDK).
            - Confirmación de descarga y acceso directo a la carpeta del código generado.
            - Copias de seguridad automáticas antes de cada parche, con restauración desde la app.
            - Interfaz en español e inglés (cambio inmediato).

            ---

            ### Aviso Legal / Disclaimer
            > **IMPORTANTE**: Este software es una herramienta de código abierto desarrollada **exclusivamente con fines educativos y de investigación**.
            >
            > 1. **Sin Alojamiento de Contenido**: Ni esta aplicación ni sus desarrolladores alojan, poseen, retransmiten o distribuyen ningún tipo de contenido multimedia, video, audio o manga.
            > 2. **Servidores de Terceros**: Las extensiones generadas son scrapers que se comunican exclusivamente con servidores web públicos e independientes operados por terceros no afiliados.
            > 3. **Propiedad Intelectual**: Todas las marcas comerciales, logotipos e imágenes pertenecen a sus respectivos propietarios legales.
            > 4. **Responsabilidad del Usuario**: El usuario es el único responsable de la legalidad y uso de las extensiones generadas en conformidad con las leyes de su país.
