[package]
name = "aext"
version = "1.0.0"
description = "AEXT - Generador y Gestor Automatizado de Extensiones Nekoyomi (Desktop & Mobile)"
authors = ["PepeTheCarton"]
edition = "2021"

[lib]
name = "aext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aext"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies", "gzip"] }
scraper = "0.20"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
chrono = "0.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[features]
default = []
python-embedded = []
